    <h1>SUPPORT DARG</h1>

    <p>Your support helps DARG rescue, care and protect animals in need. Every contribution makes a difference.</p>

    <!-- Donation Form -->
    <form>
        <label for="Donor-name">Donor Name:</label>
        <input type="text" id="Donor-name" name="Donor-name" required><br><br>

        <label for="Donor-email">Donor Email:</label>   
        <input type="email" id="Donor-email" name="Donor-email" required><br><br>

        <label for="Donation-amount">Donation Amount:</label>
        <input type="number" id="Donation-amount" name="Donation-amount" required><br><br>  
        
        <label for="Donation-message">Donation Message:</label>
        <textarea id="Donation-message" name="Donation-message"></textarea><br><br>

        <button type="submit">Donate</button>
    </form>
