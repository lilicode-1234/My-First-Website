<head>
    <meta charset="UTF-8">

<!-- Link to the CSS file -->
    <link rel="stylesheet" href="style.css">    
</head>
<!--Headet-->


<body>

    <!-- Header section -->
    <header>
        <img src="images/LOGO.jpg" alt="DARG Logo" width="150">

        
  <!-- Navigation menu -->
        <nav>
    <!-- Menu button for mobile screens -->
    <button class="menu-button" onclick="toggleMenu()">
        ☰
    </button>

    <!-- Navigation links -->
    <ul id="nav-links">
        <li><a href="index.html">Home</a></li>
        <li><a href="about.html">About Us</a></li>
        <li><a href="adopt.html">Adopt</a></li>

        <li><a href="find-us.html">Find Us</a></li>
    </ul>
</nav>

    </header>

    <!-- Main content -->
    <main>

        <!-- Donation introduction -->
        <section class="donate">
            <h1>SUPPORT DARG</h1>

            <p>
                Your support helps DARG care for and protect
                animals in need. Every contribution makes a difference.
            </p>

            <!-- Donation form -->
            <div class="donation-form">
                <form>

                    <label for="donor-name">Donor Name:</label>
                    <input type="text" id="donor-name" name="donor-name" required>

                    <label for="donor-email">Donor Email:</label>
                    <input type="email" id="donor-email" name="donor-email" required>

                    <label for="donation-amount">Donation Amount (R):</label>
                    <input type="number" id="donation-amount" name="donation-amount" min="1" required>

                    <label for="payment-method">Payment Method:</label>
                    <select id="payment-method" name="payment-method" required>
                        <option value="">Select payment method</option>
                        <option value="card">Credit/Debit Card</option>
                        <option value="eft">EFT</option>
                    </select>

                    <!-- Card payment information -->
                    <div class="card-details">
                        <h3>Card Details</h3>

                        <label for="card-name">Cardholder Name:</label>
                        <input type="text" id="card-name" name="card-name" placeholder="Name on card">

                        <label for="card-number">Card Number:</label>
                        <input type="text" id="card-number" name="card-number" placeholder="1234 5678 9012 3456">

                        <label for="expiry-date">Expiry Date:</label>
                        <input type="text" id="expiry-date" name="expiry-date" placeholder="MM/YY">

                        <label for="cvv">CVV:</label>
                        <input type="text" id="cvv" name="cvv" placeholder="123">
                    </div>

                    <label for="donation-message">Donation Message:</label>
                    <textarea id="donation-message" name="donation-message" rows="4"></textarea>

                    <button type="submit">Donate Now</button>

                </form>
            </div>

        </section>

    </main>

    <!-- Footer section -->
    <footer>
        <p>&copy; 2026 Domestic Animal Rescue Group. All rights reserved.</p>
    </footer>

</body>
</html>
